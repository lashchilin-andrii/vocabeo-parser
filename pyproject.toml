[project]
name = "vocabeo-parser"
version = "1.0.0"
description = "A Vocabeo.com parser that creates Anki notes in .txt format."
readme = "README.md"
authors = [
    { name = "Andrii", email = "lashchilin.andrii@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.61.0",
]

[project.scripts]
vocabeo-parser = "vocabeo_parser:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
